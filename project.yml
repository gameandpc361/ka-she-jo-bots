name: KashejoAssistant
options:
  bundleIdPrefix: jp.example
  deploymentTarget:
    iOS: "17.0"
targets:
  KashejoAssistant:
    type: application
    platform: iOS
    sources:
      - KashejoAssistant
    dependencies:
      - target: KashejoLiveActivity
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.example.KashejoAssistant
        PRODUCT_NAME: KashejoAssistant
        MARKETING_VERSION: "1.1.2"
        CURRENT_PROJECT_VERSION: "8"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Kashejo Assistant
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        CODE_SIGN_STYLE: Automatic
    info:
      path: KashejoAssistant/Info.plist
      properties:
        NSSupportsLiveActivities: true
        BGTaskSchedulerPermittedIdentifiers:
          - jp.example.KashejoAssistant.queue-refresh
        UIBackgroundModes:
          - fetch
  KashejoLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - KashejoLiveActivity
      - KashejoAssistant/ActivityAttributes.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.example.KashejoAssistant.LiveActivity
        PRODUCT_NAME: KashejoLiveActivity
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Kashejo Live Activity
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SKIP_INSTALL: YES
        CODE_SIGN_STYLE: Automatic
    info:
      path: KashejoLiveActivity/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
